<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>500 — Server Error · Spectra.</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body { background:#ffffff; color:#1c1d24; font-family:"Segoe UI",system-ui,sans-serif; }
    .error-page { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; }
    .error-code { font-size:6rem; font-weight:900; color:#f97316; line-height:1; }
    .error-title { font-size:1.5rem; font-weight:700; margin:0.5rem 0; }
    .error-msg { color:#888; margin-bottom:2rem; }
    .btn-home { background:#7c5cd8; color:#fff; border:none; border-radius:20px; padding:0.6rem 1.6rem; font-weight:600; text-decoration:none; transition:background 0.2s; }
    .btn-home:hover { background:#9b7de8; color:#fff; }
  </style>
</head>
<body>
<div class="error-page">
  <div class="error-code">500</div>
  <div class="error-title">Something went wrong</div>
  <p class="error-msg">An internal server error occurred. Our team has been notified.</p>
  <a href="/" class="btn-home"><i class="fas fa-home me-2"></i>Back to Home</a>
</div>
</body>
</html>
