{% extends "base.html" %}
{% block title %}Enter Passkey{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block page_controls %}{% endblock %}

{% block body %}
<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="auth-card">
    <div class="auth-brand text-center mb-4">
      <h2 class="fw-bold">Enter Passkey</h2>
      <p class="text-muted small">Choose a household profile to continue</p>
    </div>

    <form id="passkeyForm">
      <div id="passkeyError" class="alert alert-danger py-2 d-none text-center small"></div>
      <label class="form-label small text-muted" for="passkey">5-digit Passkey</label>
      <input type="password" class="form-control auth-input mb-4" id="passkey"
             maxlength="5" inputmode="numeric" autocomplete="one-time-code" required/>
      <button type="submit" class="btn btn-spectra w-100">
        <i class="fas fa-arrow-right me-2"></i>Continue to Home
      </button>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('passkeyForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const error = document.getElementById('passkeyError');
  const passkey = document.getElementById('passkey').value.trim();
  if (!/^\d{5}$/.test(passkey)) {
    error.textContent = 'Passkey must be exactly 5 digits.';
    error.classList.remove('d-none');
    return;
  }
  try {
    const response = await fetch('{{ url_for("auth.passkey_auth") }}', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({passkey}),
    });
    const data = await response.json();
    if (data.ok) {
      window.location.href = data.redirect;
      return;
    }
    error.textContent = data.error || 'Invalid passkey.';
    error.classList.remove('d-none');
  } catch {
    error.textContent = 'Connection error. Please try again.';
    error.classList.remove('d-none');
  }
});
</script>
{% endblock %}
